<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGC 影像作品集</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-soft: #131316;
    --line: rgba(255,255,255,.08);
    --text: #f2f0ec;
    --text-dim: #9a978f;
    --accent: #d8c9a3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 48px;
    background: linear-gradient(to bottom, rgba(11,11,13,.85), rgba(11,11,13,0));
    backdrop-filter: blur(6px);
  }
  .logo { font-size: 15px; letter-spacing: .35em; font-weight: 600; }
  .logo span { color: var(--accent); }
  header nav a {
    color: var(--text-dim); text-decoration: none; font-size: 13px;
    letter-spacing: .2em; margin-left: 32px; transition: color .3s;
  }
  header nav a:hover { color: var(--text); }

  /* ---------- Hero ---------- */
  .hero {
    height: 92vh; min-height: 560px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; position: relative;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 60% 45% at 50% 38%, rgba(216,201,163,.10), transparent 70%);
  }
  .hero .kicker {
    font-size: 12px; letter-spacing: .6em; color: var(--text-dim);
    text-transform: uppercase; margin-bottom: 28px; padding-left: .6em;
  }
  .hero h1 {
    font-size: clamp(44px, 7.5vw, 96px); font-weight: 700;
    letter-spacing: .12em; line-height: 1.15; padding-left: .12em;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p.sub {
    margin-top: 26px; color: var(--text-dim); font-size: 15px;
    letter-spacing: .28em; padding-left: .28em;
  }
  .scroll-hint {
    position: absolute; bottom: 42px; left: 50%; transform: translateX(-50%);
    color: var(--text-dim); font-size: 11px; letter-spacing: .4em; padding-left: .4em;
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translate(-50%,0);} 50% { transform: translate(-50%,8px);} }

  /* ---------- Works ---------- */
  .works { max-width: 1280px; margin: 0 auto; padding: 40px 48px 120px; }
  .section-head {
    display: flex; align-items: baseline; gap: 20px;
    margin-bottom: 44px; border-bottom: 1px solid var(--line); padding-bottom: 22px;
  }
  .section-head h2 { font-size: 22px; letter-spacing: .3em; font-weight: 600; }
  .section-head .count { color: var(--text-dim); font-size: 13px; letter-spacing: .15em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 34px;
  }
  .card {
    cursor: pointer; position: relative;
    opacity: 0; transform: translateY(28px);
    transition: opacity .8s ease, transform .8s ease;
  }
  .card.visible { opacity: 1; transform: none; }
  .card .poster {
    position: relative; overflow: hidden; border-radius: 6px;
    aspect-ratio: 2 / 3; background: var(--bg-soft);
    border: 1px solid var(--line);
  }
  .card .poster img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .8s cubic-bezier(.2,.6,.2,1), filter .8s;
    filter: saturate(.92);
  }
  .card:hover .poster img { transform: scale(1.05); filter: saturate(1.05); }
  .card .poster::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.55) 0%, transparent 40%);
    opacity: .8; transition: opacity .5s;
  }
  .card:hover .poster::after { opacity: 1; }
  .play-btn {
    position: absolute; top: 50%; left: 50%; z-index: 2;
    width: 64px; height: 64px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.7);
    transform: translate(-50%,-50%) scale(.85);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .4s, transform .4s;
    background: rgba(0,0,0,.25); backdrop-filter: blur(4px);
  }
  .card:hover .play-btn { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .play-btn svg { width: 20px; height: 20px; fill: #fff; margin-left: 3px; }
  .card .num {
    position: absolute; top: 16px; left: 16px; z-index: 2;
    font-size: 12px; letter-spacing: .25em; color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.35); padding: 5px 12px; border-radius: 3px;
    backdrop-filter: blur(4px);
  }
  .card .meta { margin-top: 16px; }
  .card .meta h3 { font-size: 17px; font-weight: 600; letter-spacing: .08em; }
  .card .meta .tags { margin-top: 7px; color: var(--text-dim); font-size: 12px; letter-spacing: .18em; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,5,6,.94); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .35s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox-inner {
    width: min(1100px, 92vw); max-height: 88vh;
    display: flex; flex-direction: column; align-items: center;
    transform: scale(.96); transition: transform .35s ease;
  }
  .lightbox.open .lightbox-inner { transform: scale(1); }
  .lightbox video {
    width: 100%; max-height: 76vh; border-radius: 6px;
    background: #000; outline: none; box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .lightbox .lb-title {
    margin-top: 20px; font-size: 16px; letter-spacing: .2em; color: var(--text);
    display: flex; align-items: center; gap: 18px;
  }
  .lb-nav {
    background: none; border: 1px solid var(--line); color: var(--text-dim);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    font-size: 14px; transition: all .3s;
  }
  .lb-nav:hover { color: var(--text); border-color: rgba(255,255,255,.4); }
  .lb-close {
    position: absolute; top: 28px; right: 36px;
    background: none; border: none; color: var(--text-dim);
    font-size: 30px; cursor: pointer; line-height: 1; transition: color .3s;
  }
  .lb-close:hover { color: #fff; }

  footer {
    border-top: 1px solid var(--line);
    padding: 44px 48px; text-align: center;
    color: var(--text-dim); font-size: 12px; letter-spacing: .3em;
  }

  @media (max-width: 640px) {
    header { padding: 16px 20px; }
    header nav a { margin-left: 18px; }
    .works { padding: 24px 20px 80px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .card .meta h3 { font-size: 14px; }
    .card .meta .tags { font-size: 10px; letter-spacing: .1em; }
    .play-btn { width: 46px; height: 46px; opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .play-btn svg { width: 15px; height: 15px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">AIGC <span>·</span> WORKS</div>
  <nav>
    <a href="#works">作品</a>
    <a href="#top">顶部</a>
  </nav>
</header>

<section class="hero" id="top">
  <div class="kicker">AI Generated Content Portfolio</div>
  <h1>AIGC <em>影像作品集</em></h1>
  <p class="sub">用人工智能，讲每一个故事</p>
  <div class="scroll-hint">SCROLL ↓</div>
</section>

<section class="works" id="works">
  <div class="section-head">
    <h2>精 选 作 品</h2>
    <span class="count">05 WORKS</span>
  </div>

  <div class="grid" id="grid"></div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="关闭">×</button>
  <div class="lightbox-inner">
    <video id="lbVideo" controls playsinline preload="metadata"></video>
    <div class="lb-title">
      <button class="lb-nav" id="lbPrev" aria-label="上一个">←</button>
      <span id="lbTitle"></span>
      <button class="lb-nav" id="lbNext" aria-label="下一个">→</button>
    </div>
  </div>
</div>

<footer>AIGC PORTFOLIO © 2026 &nbsp;·&nbsp; AI GENERATED FILMS</footer>

<script>
const works = [
  {
    title: "寒王殿下的隐婚药妃",
    tags: "古风短剧 · AIGC 创作",
    cover: "assets/covers/hanwang.jpg",
    video: "assets/videos/hanwang.mp4"
  },
  {
    title: "家有一姥",
    tags: "温情短剧 · AIGC 创作",
    cover: "assets/covers/jiayouyilao.jpg",
    video: "assets/videos/jiayouyilao.mp4"
  },
  {
    title: "夜噬",
    tags: "惊悚悬疑 · AIGC 创作",
    cover: "assets/covers/yeshi.jpg",
    video: "assets/videos/yeshi.mp4"
  },
  {
    title: "野火",
    tags: "末世冒险 · AIGC 创作",
    cover: "assets/covers/yehuo.jpg",
    video: "assets/videos/yehuo.mp4"
  },
  {
    title: "Mustang 汽车广告",
    tags: "商业广告 · AIGC 创作",
    cover: "assets/covers/mustang.jpg",
    video: "assets/videos/mustang.mp4"
  }
];

const grid = document.getElementById("grid");
works.forEach((w, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="poster">
      <span class="num">0${i + 1}</span>
      <img src="${w.cover}" alt="${w.title}" loading="lazy">
      <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="meta">
      <h3>${w.title}</h3>
      <div class="tags">${w.tags}</div>
    </div>`;
  card.addEventListener("click", () => openLightbox(i));
  grid.appendChild(card);
});

/* 入场动画 */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll(".card").forEach((c, i) => {
  c.style.transitionDelay = `${(i % 3) * 90}ms`;
  io.observe(c);
});

/* 灯箱播放器 */
const lightbox = document.getElementById("lightbox");
const lbVideo = document.getElementById("lbVideo");
const lbTitle = document.getElementById("lbTitle");
let current = -1;

function openLightbox(i) {
  current = i;
  lbVideo.src = works[i].video;
  lbTitle.textContent = `0${i + 1} · ${works[i].title}`;
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
  lbVideo.play().catch(() => {});
}
function closeLightbox() {
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
  lbVideo.pause();
  setTimeout(() => { lbVideo.src = ""; }, 350);
}
function step(d) {
  openLightbox((current + d + works.length) % works.length);
}
document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
</script>
</body>
</html>
